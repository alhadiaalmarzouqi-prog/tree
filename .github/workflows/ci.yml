name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sovereign_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: sovereign_lineage_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sovereign_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - name: Database connectivity check
        env:
          DATABASE_URL: postgres://sovereign_app:ci_password@localhost:5432/sovereign_lineage_dev
        run: npm run db:check

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  m0-regression:
    name: M0 regression (fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python project-docs-en/verification/m0-recalc/m0_verify.py
      - run: python project-docs-en/verification/m0-recalc/m0_mutation_check.py